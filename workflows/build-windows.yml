name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target MotifKit_VST3 --parallel 4

      - uses: actions/upload-artifact@v4
        with:
          name: MotifKit-Windows-VST3
          path: build/MotifKit_artefacts/Release/VST3
