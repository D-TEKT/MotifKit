name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure - universal build for Apple Silicon and Intel
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3
        run: cmake --build build --config Release --target MotifKit_VST3 --parallel 4

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "build/MotifKit_artefacts/Release/VST3/MotifKit.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: MotifKit-macOS-VST3
          path: build/MotifKit_artefacts/Release/VST3
